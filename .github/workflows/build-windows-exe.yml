name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build propel Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WiX Toolset 3
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }

      - name: Build and test desktop and web launchers
        shell: powershell
        run: .\scripts\package-windows.ps1 -PackageType All

      - name: Verify Windows launchers and default web runtime
        shell: powershell
        run: |
          $mainLauncher = ".\release\windows\portable\propel\propel.exe"
          $webLauncher = ".\release\windows\portable\propel\propel-web.exe"
          $desktopLauncher = ".\release\windows\portable\propel\propel-desktop.exe"
          foreach ($launcher in @($mainLauncher, $webLauncher, $desktopLauncher)) {
            if (-not (Test-Path $launcher -PathType Leaf)) {
              throw "Expected Windows launcher was not created: $launcher"
            }
          }

          $env:PORT = "18080"
          $process = Start-Process -FilePath $mainLauncher -PassThru
          try {
            $health = $null
            foreach ($attempt in 1..30) {
              try {
                $health = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:18080/api/health" `
                  -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $health -or $health.status -ne "ok" -or -not $health.desktopMode) {
              throw "propel.exe did not start the local web application in desktop mode."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Write SHA-256 checksum
        shell: powershell
        run: |
          $files = Get-ChildItem .\release\windows\* -File |
            Where-Object { $_.Extension -in @(".exe", ".zip") }
          if (-not $files) {
            throw "Windows release files were not created."
          }
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content .\release\windows\SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows installer and portable launchers
        uses: actions/upload-artifact@v4
        with:
          name: propel-Windows-exe
          path: |
            release/windows/*.exe
            release/windows/*.zip
            release/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
